<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>1.1.1 · Ý nguyện của Thảo · My Life Picture 2026</title>
<meta name="description" content="Ý nguyện của Thảo — Trưởng thành & Support Life." />
<style>
:root{--bg:#f5f1e9;--paper:#fffdf8;--ink:#17383d;--muted:#667d7c;--teal:#1f6871;--line:rgba(23,56,61,.14)}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:"Aptos","Segoe UI",Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
a{color:inherit;text-decoration:none}
nav{position:fixed;inset:0 0 auto 0;z-index:100;background:rgba(245,241,233,.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.shell{max-width:1180px;margin:auto;padding:0 24px}
.nav-top{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{font-size:13px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);white-space:nowrap}
.site-tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}.site-tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:9px 13px;border-radius:999px;border:1px solid var(--line);background:rgba(255,253,248,.78);font-size:13px;font-weight:800;color:var(--muted);transition:.2s ease}
.tab:hover{color:var(--teal);background:var(--paper)}
.tab.active{background:var(--teal);border-color:var(--teal);color:#fff}
.tab.parent{background:var(--paper);color:var(--teal)}
.frame-wrap{position:fixed;top:73px;left:0;right:0;bottom:0;background:var(--bg)}
iframe{display:block;width:100%;height:100%;border:0;background:var(--bg)}
@media(max-width:700px){.shell{padding:0 16px}.nav-top{min-height:88px;align-items:flex-start;flex-direction:column;justify-content:center;gap:8px}.frame-wrap{top:89px}.brand{font-size:12px}.tab{font-size:12px;padding:8px 11px}}
</style>
</head>
<body>
<nav>
  <div class="shell nav-top">
    <div class="brand">Thảo · My Life Picture 2026</div>
    <div class="site-tabs" aria-label="My Life Picture navigation">
      <a class="tab parent" href="index.html">← 1 · Tâm thức</a>
      <a class="tab active" href="y-nguyen.html">1.1.1 · Ý nguyện</a>
    </div>
  </div>
</nav>
<div class="frame-wrap">
  <iframe id="detailFrame" src="y-nguyen-content.html" title="1.1.1 Ý nguyện của Thảo" loading="eager"></iframe>
</div>
<script>
const frame=document.getElementById('detailFrame');
frame.addEventListener('load',()=>{
  try{
    const doc=frame.contentDocument;
    const legacyNav=doc && doc.querySelector('nav');
    if(legacyNav) legacyNav.style.display='none';
  }catch(e){}
});
</script>
</body>
</html>
